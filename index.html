l:"Ler com regularidade vale mais que ler muito de uma vez. Escolha um horário fixo, comece por um evangelho (como Marcos ou João) e leia um trecho curto por dia, anotando o que chamou sua atenção.",
L:["Ler com regularidade vale mais que ler muito de uma vez. Escolha um horário fixo, comece por um evangelho (como Marcos ou João) e leia um trecho curto por dia, anotando o que chamou sua atenção.",
"Método OIA: Observação (o que o texto diz? quem, o quê, onde, quando), Interpretação (o que significava para os primeiros leitores?) e Aplicação (o que muda na minha vida?). Siga essa ordem.",
"Gêneros literários: a Bíblia tem narrativa, lei, poesia, sabedoria, profecia, evangelhos e cartas. Cada gênero se lê de um jeito: poesia usa imagens, provérbios são princípios gerais, cartas respondem a situações concretas.",
"Contexto: antes de interpretar um versículo, leia o que vem antes e depois e descubra quem escreveu, para quem e em que situação. Um versículo isolado pode ser entendido de forma errada.",
"Estrutura: na maioria das edições, o Antigo Testamento tem 39 livros (Lei, História, Poesia e Sabedoria, Profetas) e o Novo Testamento tem 27 (Evangelhos, Atos, Cartas e Apocalipse). Algumas tradições incluem livros adicionais.",
"Comparar traduções e usar notas ajuda a entender passagens difíceis. Use mais de uma tradução, consulte dicionários bíblicos e, quando houver dúvida, converse com um líder ou professor de confiança.",
"Aplicação responsável: pergunte o que o texto ensina sobre Deus e sobre as pessoas e o que ele pede de você. Escolha uma ação pequena e concreta e registre depois como foi.",
"Estudo em profundidade: acompanhe um tema (como perdão ou sabedoria) por vários livros, anote as passagens e escreva uma síntese. Ensinar o que aprendeu a outra pessoa consolida o estudo."],

l:"Leitura com propósito: antes de ler, defina por que você lê (aprender, decidir, se divertir). O propósito define o ritmo, o que anotar e quando parar.",
L:["Leitura com propósito: antes de ler, defina por que você lê (aprender, decidir, se divertir). O propósito define o ritmo, o que anotar e quando parar.",
"Pré-leitura: observe título, sumário, introdução, conclusão e títulos de capítulos. Em 5 minutos você monta um mapa do livro e sabe onde prestar mais atenção.",
"Método SQ3R: Survey (examinar), Question (perguntar), Read (ler), Recite (recitar com suas palavras) e Review (revisar). Transforme títulos em perguntas e responda sem olhar.",
"Anotações úteis: marque pouco e escreva muito, com suas palavras. Registre ideia central, exemplos, dúvidas e aplicações. Anotar com as próprias palavras é o que fixa o conteúdo.",
"Retenção: revise o que leu em 1, 3, 7 e 21 dias, resuma cada capítulo em 3 linhas e ensine o conteúdo a alguém. Reler tudo é menos eficaz que se testar.",
"Leitura crítica: pergunte qual é a tese do autor, que evidências ele usa, que objeções existem e o que ficou de fora. O objetivo é concordar ou discordar com base em argumentos.",
"Hábito de leitura: leia no mesmo horário, comece com 10 a 15 minutos, deixe o livro à vista e acompanhe páginas ou tempo. Constância vence maratona.",
"Tipos de texto: ficção pede imersão, não ficção pede mapa e anotação, e textos técnicos pedem leitura em camadas (visão geral e depois detalhes). Adapte o método ao tipo de texto."],

const EXTRA5={
emo:["Comunicação emocional: expresse o que sente com frases como \"eu me sinto… quando… porque…\". Falar do que sente sem acusar reduz defesas e aproxima as pessoas.","Estresse e recuperação: o estresse prolongado reduz a clareza e a paciência. Programe pausas, sono regular, movimento e descanso real; recuperar-se faz parte do desempenho.","Mágoas e perdão: remoer mágoas prende a atenção no passado. Reconheça o que sentiu, defina o que precisa mudar e decida o que fazer. Perdoar não é aprovar o que ocorreu, é soltar o peso que você carrega.","Emoções no trabalho: perceba o clima, peça esclarecimentos antes de supor intenções e, diante de críticas, separe o fato da interpretação. Isso evita conflitos desnecessários."],
int:["Modelos mentais: são formas simples de entender situações, como custo de oportunidade e causa e efeito. Aprender alguns bons modelos melhora a análise de problemas de áreas diferentes.","Falácias e vieses comuns: cuidado com o apelo à emoção, o falso dilema (só duas opções), a ladeira escorregadia e o viés de disponibilidade (julgar pelo que vem fácil à mente). Nomear o erro ajuda a evitá-lo.","Estudar com foco: estude em blocos de 25 a 50 minutos, com um objetivo por bloco e longe de distrações. Alterne temas, faça testes e explique em voz alta o que aprendeu.","Criatividade: separe gerar de avaliar. Primeiro produza muitas opções sem julgar e depois escolha com critérios. Combinar ideias de áreas diferentes costuma gerar soluções originais."],
lin:["Histórias que comunicam: apresente um personagem, um desafio, o que foi feito e o resultado. Use exemplos concretos em vez de abstrações.","Escrita clara: prefira frases curtas, voz ativa e palavras simples. Corte o que não acrescenta e coloque a ideia principal no começo do parágrafo.","Debate respeitoso: resuma o argumento do outro antes de responder, discuta ideias e não pessoas e admita pontos válidos. O objetivo é entender melhor, não só vencer.","Aprender idiomas: combine vocabulário em contexto, escuta ativa e fala desde cedo. Use o idioma em situações reais, mesmo com erros, e revise as palavras em intervalos crescentes."],
intra:["Energia e rotina: reserve as tarefas difíceis para os horários de maior energia, proteja o sono e use pausas curtas. Uma rotina bem desenhada reduz a necessidade de decidir o tempo todo.","Dizer não: recusar o que não é prioridade libera tempo para o que importa. Responda com clareza e respeito, sem excesso de justificativas, e ofereça alternativa quando fizer sentido.","Ambiente e foco: o ambiente influencia o comportamento. Deixe à vista o que quer fazer e longe o que distrai; pequenas mudanças no espaço reduzem o esforço de força de vontade.","Valores e escolhas: escrever seus valores (como honestidade, família, fé e crescimento) ajuda a decidir o que aceitar e o que recusar. Quando metas e valores combinam, a consistência fica mais fácil."],
inter:["Feedback: ao dar, descreva o comportamento, o impacto e uma sugestão. Ao receber, escute até o fim, agradeça e peça exemplos antes de reagir.","Trabalho em equipe: equipes funcionam com objetivos claros, papéis definidos e combinados sobre como comunicar problemas. Admitir erros cedo reduz danos e aumenta a confiança.","Limites e assertividade: limites claros protegem relacionamentos. Diga o que aceita e o que não aceita de forma direta e calma e mantenha coerência com o que combinou.","Rede de contatos ética: construir contatos é ajudar antes de pedir. Ofereça informação, apresente pessoas e mantenha contato regular; relações duradouras vêm de interesse genuíno."],
fin:["Saindo das dívidas: liste todas, priorize as de juros mais altos, negocie condições e evite novas dívidas durante o processo. Pequenas economias consistentes ajudam a quitar mais rápido.","Metas financeiras: defina metas com valor, prazo e passos. Divida o valor pelo número de meses e separe o dinheiro no dia em que a renda entra, de preferência de forma automática.","Proteção contra imprevistos: imprevistos podem desfazer anos de planejamento. Avalie proteções compatíveis com a sua realidade e compare custos e coberturas antes de contratar.","Empreender com testes: antes de investir muito, teste a ideia. Converse com clientes, venda uma versão simples e meça o interesse; ajuste com base no que o mercado responde."],

async function execTool(tc,c){const T=TOOLS[tc.name];let res;
if(!T)res={ok:false,error:"ferramenta desconhecida"};else{const v=vArgs(T,tc.args);
if(v.error)res={ok:false,error:v.error};else if(T.data&&!S.ai.share.prog)res={ok:false,error:"o usuário não autorizou o acesso aos dados do app"};
else{let go=true;if(T.confirm)go=await askConfirm(T.ask(v.args));if(!go)res={ok:false,error:"o usuário cancelou a ação"};else{try{res=T.run(v.args)}catch(e){res={ok:false,error:"falha ao executar"}}}
if(res.ok&&T.write)active()}}
c.m.push({r:"s",t:(res.ok?"✓ ":"⚠ ")+(res.msg||"Ação não realizada: "+res.error)});
save();render();return res}
async function runAgent(c){BUSY=true;ABORT=new AbortController();render();
const wire=c.m.filter(x=>x.r!="s").slice(-20).map(x=>({role:x.r=="u"?"user":"assistant",content:x.t}));while(wire.length&&wire[0].role!="user")wire.shift();
try{let fin=false;for(let i=0;i<5&&!fin;i++){const r=await callAI(wire,ABORT.signal);
if(r.toolCalls&&r.toolCalls.length){if(r.text)c.m.push({r:"a",t:r.text});wire.push({role:"assistant",content:r.text||"",toolCalls:r.toolCalls,state:r.state||undefined});
for(const tc of r.toolCalls.slice(0,4)){const res=await execTool(tc,c);wire.push({role:"tool",toolName:tc.name,content:JSON.stringify(res.ok?{ok:true,mensagem:res.msg,...(res.data||{})}:{ok:false,erro:res.error})})}}
else{c.m.push({r:"a",t:(r.text||"").trim()||"(sem resposta)"});fin=true}}
if(!fin)c.m.push({r:"s",t:"⚠ Limite de passos atingido sem resposta final."})}
catch(e){c.m.push({r:"s",t:e&&e.name=="AbortError"?"Resposta interrompida.":errMsg(e||{})})}
BUSY=false;ABORT=null;PEND=null;save();render()}
function curChat(){let c=S.chats.find(x=>x.id==S.cid);if(!c){c={id:nid(),t:"Nova conversa",ts:Date.now(),m:[]};S.chats.push(c);S.cid=c.id;if(S.chats.length>30)S.chats.shift()}return c}
function sendText(t){if(BUSY||!ready())return;const c=curChat();if(!c.m.length)c.t=t.slice(0,40);c.m.push({r:"u",t:t.slice(0,4000)});c.ts=Date.now();CDRAFT="";active();save();runAgent(c)}
function doSend(){const t=$("#cin").value.trim();if(t)sendText(t)}
function quick(i){sendText(QK[i][1])}
function newChat(){S.cid="";IAT="chat";render()}
function openChat(id){S.cid=id;IAT="chat";render()}
function delChat(id){if(confirm("Excluir esta conversa?")){S.chats=S.chats.filter(c=>c.id!=id);if(S.cid==id)S.cid="";render()}}
function scrollMsgs(){try{const e=document.getElementById("msgs");if(e)e.scrollTop=e.scrollHeight}catch(e){}}
const bub=x=>x.r=="u"?`<div class="b bu">${esc(x.t)}</div>`:x.r=="a"?`<div class="b ba">${md(x.t)}</div>`:`<div class="b bs">${esc(x.t)}</div>`;
function chatBody(){if(!ready())return`<div class="card"><h3>Conecte a IA</h3><p>Para conversar, publique o serviço intermediário (Cloudflare Worker) e informe o endereço e o token em <b>Ajustes</b>. A chave do provedor fica só no servidor, nunca no app.</p><button class="pri" onclick="IAT='cfg';render()">Ir para Ajustes</button></div>`;
const c=S.chats.find(x=>x.id==S.cid),m=c?c.m:[];
return`<div class="card"><div id="msgs" role="log" aria-live="polite" style="max-height:52vh;overflow-y:auto">${m.length?"":'<div class="b ba">Olá! Sou a A.P.E.X. AI. Posso tirar dúvidas, criar planos, analisar seu progresso e usar as ferramentas do app (metas, hábitos e lembretes). Sobre o que quer conversar?</div>'}${m.map(bub).join("")}${PEND?`<div class="b bs" role="alert">${esc(PEND.text)}<br><button class="pri" onclick="confirmAns(true)">Confirmar</button> <button onclick="confirmAns(false)">Cancelar</button></div>`:""}${BUSY&&!PEND?'<div class="b ba typing" aria-label="Processando">Pensando<i>.</i><i>.</i><i>.</i></div>':""}</div></div><div class="row">${QK.map((q,i)=>`<button ${BUSY?"disabled":""} onclick="quick(${i})">${q[0]}</button>`).join("")}</div><div class="card"><textarea id="cin" rows="2" aria-label="Mensagem" placeholder="Digite sua mensagem..." ${BUSY?"disabled":""} oninput="CDRAFT=this.value">${esc(CDRAFT)}</textarea><button class="pri" ${BUSY?"disabled":""} onclick="doSend()">Enviar</button> ${BUSY?'<button onclick="stopAI()">Parar</button> ':""}<button onclick="newChat()">Nova conversa</button></div>`}
function histBody(){return`<div class="card"><button class="pri" onclick="newChat()">Nova conversa</button></div>`+(S.chats.length?S.chats.slice().reverse().map(c=>`<div class="card"><b>${esc(c.t)}</b><div class="mut">${esc(new Date(c.ts).toLocaleString("pt-BR"))} · ${c.m.length} mensagens</div><button onclick="openChat('${c.id}')">Abrir</button> <button onclick="delChat('${c.id}')">Excluir</button></div>`).join(""):'<div class="card mut">Nenhuma conversa ainda.</div>')}
function memBody(){return`<div class="card"><h2>Memória de longo prazo</h2><p class="mut">Fatos que você autorizou a IA a lembrar. Você pode editar e apagar quando quiser. A IA nunca salva sozinha: ela pede a sua confirmação.</p><label>Novo item<input type="text" id="mn" maxlength="300" placeholder="Ex.: Prefiro estudar de manhã"></label><button class="pri" onclick="addMem()">Adicionar</button></div>`+(S.mem.length?S.mem.map(m=>MEDIT==m.id?`<div class="card"><input type="text" id="me" maxlength="300" value="${esc(m.t)}" aria-label="Editar item"><button class="pri" onclick="saveMem('${m.id}')">Salvar</button> <button onclick="MEDIT=null;render()">Cancelar</button></div>`:`<div class="card"><div>${esc(m.t)}</div><div class="mut">${esc(m.d)}</div><button onclick="MEDIT='${m.id}';render()">Editar</button> <button onclick="delMem('${m.id}')">Excluir</button></div>`).join("")+'<div class="card"><button onclick="clearMem()">Apagar toda a memória</button></div>':'<div class="card mut">Memória vazia.</div>')}
function addMem(){const t=$("#mn").value.trim();if(!t){alert("Escreva o item.");return}if(S.mem.length>=50){alert("Memória cheia (50 itens).");return}S.mem.push({id:nid(),t:t.slice(0,300),d:today()});render()}
function saveMem(id){const t=$("#me").value.trim(),m=S.mem.find(x=>x.id==id);if(m&&t)m.t=t.slice(0,300);MEDIT=null;render()}
function delMem(id){if(confirm("Excluir este item da memória?")){S.mem=S.mem.filter(m=>m.id!=id);render()}}
function clearMem(){if(confirm("Apagar toda a memória da IA?")){S.mem=[];render()}}
function chatPage(){const T=[["chat","Conversa"],["hist","Histórico"],["mem","Memória"],["cfg","Ajustes"]];
return`<div class="card aihead">${AV}<div><h2 style="margin:0">A.P.E.X. AI</h2><div class="mut">Seu mentor para pensar, aprender e evoluir</div><div style="margin-top:4px"><span class="dot${ready()?" ok":""}"></span>${ready()?"Online":"Não configurada"}</div></div></div><div class="row" role="tablist">${T.map(([k,v])=>`<button role="tab" aria-selected="${IAT==k}" class="${IAT==k?"on":""}" onclick="IAT='${k}';render()">${v}</button>`).join("")}</div>`+({chat:chatBody,hist:histBody,mem:memBody,cfg:iaView})[IAT]()}
function saveEp(){const v=$("#aiep").value.trim().replace(/\/+$/,""),t=$("#ait").value.trim();if(v&&!/^https:\/\/\S+$/.test(v)){alert("Use um endereço que comece com https://");return}S.ai.endpoint=v;S.ai.token=t.slice(0,200);save();alert("Salvo.");render()}
async function testConn(){const o=$("#aiout"),ep=$("#aiep").value.trim().replace(/\/+$/,""),t=$("#ait").value.trim();if(!/^https:\/\/\S+$/.test(ep)){o.textContent="Informe um endereço https válido.";return}o.textContent="Testando...";try{const r=await fetch(ep+"/health",{headers:{"X-Apex-Token":t}});o.textContent=r.ok?"Conexão OK.":r.status==401?"Token incorreto.":r.status==403?"Origem não permitida: confira ALLOWED_ORIGIN no Worker.":"Falha: código "+r.status}catch(e){o.textContent="Não foi possível conectar. Confira o endereço."}}
function metasView(){const t=today();return`<div class="card"><h2>Nova meta</h2><label>Título<input type="text" id="mt" maxlength="120"></label><label>Área (opcional)<select id="ma"><option value="">Nenhuma</option>${AREAS.map(a=>`<option value="${a.id}">${esc(a.n)}</option>`).join("")}</select></label><label>Prazo (opcional)<input type="date" id="md"></label><p></p><button class="pri" onclick="addM()">Adicionar meta</button></div>`+(S.metas.length?S.metas.slice().reverse().map(m=>{const late=!m.done&&m.due&&m.due<t;return`<div class="card"><label class="opt"><input type="checkbox" ${m.done?"checked":""} onchange="togM('${m.id}')"> <span${m.done?' style="text-decoration:line-through"':""}>${esc(m.t)}</span></label><div class="mut">${m.a?esc(AN(m.a))+" · ":""}${m.due?"prazo "+esc(m.due):"sem prazo"}${late?' · <span class="bad">atrasada</span>':""}</div><button onclick="delM('${m.id}')">Excluir</button></div>`}).join(""):'<div class="card mut">Nenhuma meta ainda. Crie uma acima ou peça à A.P.E.X. AI.</div>')}
function addM(){const t=$("#mt").value.trim(),a=$("#ma").value,d=$("#md").value;if(!t){alert("Dê um título à meta.");return}if(S.metas.length>=200){alert("Limite de 200 metas.");return}S.metas.push({id:nid(),t:t.slice(0,120),a:AIDS.includes(a)?a:"",due:okDate(d)?d:"",done:false,d:today()});active();render()}
function togM(id){const m=S.metas.find(x=>x.id==id);if(m){m.done=!m.done;if(m.done)active()}render()}
function delM(id){if(confirm("Excluir esta meta?")){S.metas=S.metas.filter(m=>m.id!=id);render()}}
let QZ;
function quiz(a){const A=AREAS.find(x=>x.id==a);if(S.tests.some(t=>t.a==a&&t.d==today())){alert("Um teste por área por dia. Volte amanhã.");return}
QZ={a,qs:pick(A).map(q=>({q:q[0],o:q.slice(1).map((t,i)=>({t,c:i==0})).sort(()=>Math.random()-.5)}))};
$("#app").innerHTML=`<div class="card"><h2>Teste: ${A.n}</h2>${QZ.qs.map((q,i)=>`<div><b>${esc(q.q)}</b>${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${esc(o.t)}</label>`).join("")}</div>`).join("")}<button class="pri" onclick="grade()">Corrigir</button> <button onclick="go('treino')">Cancelar</button></div>`}
function grade(){let ok=0;QZ.qs.forEach((q,i)=>{const s=document.querySelector(`input[name=q${i}]:checked`),r=s&&q.o[+s.value].c;srsUpd(QZ.a,q,!!r);if(r){ok++;S.errs=S.errs.filter(e=>e.q!=q.q)}else if(!S.errs.some(e=>e.q==q.q))S.errs.push({a:QZ.a,q:q.q,c:q.o.find(o=>o.c).t})});
const sc=Math.round(ok/QZ.qs.length*100),p=sc>=70;S.tests.push({a:QZ.a,d:today(),s:sc,ok:p});active();if(p)award(QZ.a,40);else award(QZ.a,5);
alert(p?`Aprovado com ${sc}%. +40 XP`:`${sc}%. Nota mínima: 70%. Revise a aula e tente amanhã.`);go("treino")}
function aiPrompt(){$("#aip").value=aiText()}
function exp(){S.lastBackup=today();save();const b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="apex-backup-"+today()+".json";a.click()}
function imp(ev){const f=ev.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.xp||!d.done)throw 0;if(confirm("Substituir os dados atuais pelo backup?")){S=clean(d);render()}}catch(e){alert("Arquivo de backup inválido.")}})}
active();badges();render();if(RECOVERED)alert("Os dados principais estavam corrompidos. Recuperei a última cópia automática.");
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
