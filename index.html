function bkp(){const d=S.lastBackup,n=d?Math.floor((Date.now()-new Date(d))/864e5):null;if(S.days.length<3||(n!==null&&n<7))return"";return`<div class="card"><b>Proteja seus dados:</b> ${d?"último backup há "+n+" dias":"você ainda não fez backup"}. <button onclick="go('dados')">Fazer backup</button></div>`}
function dadosView(){const sz=(JSON.stringify(S).length/1024).toFixed(0),sn=(parse(SNAP)||{list:[]}).list;
return`<div class="card"><h2>Backup</h2><p>Seus dados ficam neste navegador (${sz} KB usados). Exporte com frequência.</p><button class="pri" onclick="exp()">Exportar backup (.json)</button> <input type="file" id="imp" accept=".json" onchange="imp(event)"></div><div class="card"><h2>Cópias automáticas</h2><p class="mut">O app guarda uma cópia por dia nos últimos 3 dias de uso e recupera sozinho se o arquivo principal ficar corrompido.</p>${sn.map((x,i)=>`<div style="margin:6px 0">${esc(x.d)} <button onclick="restoreSnap(${i})">Restaurar</button></div>`).join("")||'<span class="mut">Ainda sem cópias.</span>'}<p class="mut">Versão dos dados: ${S.v}</p></div>`}
function restoreSnap(i){const l=(parse(SNAP)||{list:[]}).list;if(!l[i]||!confirm("Substituir os dados atuais pela cópia de "+l[i].d+"?"))return;S=clean(l[i].s);render()}
function coach(){const L=[],A=AREAS.slice().sort((x,y)=>level(x.id)-level(y.id)||(S.xp[x.id]||0)-(S.xp[y.id]||0)),w=A[0],w2=A[1];
L.push(`Foco da semana: ${w.n} (nível ${level(w.id)}) e ${w2.n} (nível ${level(w2.id)}).`);L.push(`Pendente em ${w.n}: ${need(w.id)}`);
if(S.errs.length)L.push(`Revise as ${Math.min(S.errs.length,5)} perguntas que errou (aba Treino) antes de novos testes.`);
const last=S.assess.filter(x=>x.v.length==12).at(-1);if(last){const low=AQ.flat().filter((q,i)=>last.v[i]<=2);if(low.length)L.push("Dificuldade da última avaliação: "+low[0]+".")}
const st=streak();L.push(st<3?"Sequência curta: defina um horário fixo de 15 minutos por dia, mesmo que seja só para uma missão.":`Sequência de ${st} dias: mantenha o ritmo.`);
const op=A.filter(a=>a.d[level(a.id)]&&!S.chal.some(c=>c.a==a.id&&c.L==level(a.id)));if(op.length)L.push(`Desafio de aplicação aberto: ${op[0].n}, nível ${level(op[0].id)}.`);
const D=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];return{L,plan:D.map((d,i)=>d+": "+(i==6?"revisão da semana e registro no diário":i%2?"missão de "+w2.n:"missão ou teste de "+w.n))}}
function coachCard(){const c=coach();return`<div class="card"><h2>Plano local da semana</h2><p class="mut">Calculado no seu aparelho, sem enviar nada.</p>${c.L.map(x=>`<div>• ${esc(x)}</div>`).join("")}<h3 style="margin-top:10px">Roteiro de 7 dias</h3>${c.plan.map(x=>`<div>${x}</div>`).join("")}</div>`}
let QZ;
function quiz(a){const A=AREAS.find(x=>x.id==a);if(S.tests.some(t=>t.a==a&&t.d==today())){alert("Um teste por área por dia. Volte amanhã.");return}
QZ={a,qs:pick(A).map(q=>({q:q[0],o:q.slice(1).map((t,i)=>({t,c:i==0})).sort(()=>Math.random()-.5)}))};
$("#app").innerHTML=`<div class="card"><h2>Teste: ${A.n}</h2>${QZ.qs.map((q,i)=>`<div><b>${esc(q.q)}</b>${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${esc(o.t)}</label>`).join("")}</div>`).join("")}<button class="pri" onclick="grade()">Corrigir</button> <button onclick="go('treino')">Cancelar</button></div>`}
function grade(){let ok=0;QZ.qs.forEach((q,i)=>{const s=document.querySelector(`input[name=q${i}]:checked`),r=s&&q.o[+s.value].c;if(r){ok++;S.errs=S.errs.filter(e=>e.q!=q.q)}else if(!S.errs.some(e=>e.q==q.q))S.errs.push({a:QZ.a,q:q.q,c:q.o.find(o=>o.c).t})});
const sc=Math.round(ok/QZ.qs.length*100),p=sc>=70;S.tests.push({a:QZ.a,d:today(),s:sc,ok:p});active();if(p)award(QZ.a,40);else award(QZ.a,5);
alert(p?`Aprovado com ${sc}%. +40 XP`:`${sc}%. Nota mínima: 70%. Revise a aula e tente amanhã.`);go("treino")}
function aiPrompt(){$("#aip").value=aiText()}
function exp(){S.lastBackup=today();save();const b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="apex-backup-"+today()+".json";a.click()}
function imp(ev){const f=ev.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.xp||!d.done)throw 0;if(confirm("Substituir os dados atuais pelo backup?")){S=clean(d);render()}}catch(e){alert("Arquivo de backup inválido.")}})}
active();badges();render();if(RECOVERED)alert("Os dados principais estavam corrompidos. Recuperei a última cópia automática.");
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
