l:"Ler com regularidade vale mais que ler muito de uma vez. Escolha um horário fixo, comece por um evangelho (como Marcos ou João) e leia um trecho curto por dia, anotando o que chamou sua atenção.",
L:["Ler com regularidade vale mais que ler muito de uma vez. Escolha um horário fixo, comece por um evangelho (como Marcos ou João) e leia um trecho curto por dia, anotando o que chamou sua atenção.",
"Método OIA: Observação (o que o texto diz? quem, o quê, onde, quando), Interpretação (o que significava para os primeiros leitores?) e Aplicação (o que muda na minha vida?). Siga essa ordem.",
"Gêneros literários: a Bíblia tem narrativa, lei, poesia, sabedoria, profecia, evangelhos e cartas. Cada gênero se lê de um jeito: poesia usa imagens, provérbios são princípios gerais, cartas respondem a situações concretas.",
"Contexto: antes de interpretar um versículo, leia o que vem antes e depois e descubra quem escreveu, para quem e em que situação. Um versículo isolado pode ser entendido de forma errada.",
"Estrutura: na maioria das edições, o Antigo Testamento tem 39 livros (Lei, História, Poesia e Sabedoria, Profetas) e o Novo Testamento tem 27 (Evangelhos, Atos, Cartas e Apocalipse). Algumas tradições incluem livros adicionais.",
"Comparar traduções e usar notas ajuda a entender passagens difíceis. Use mais de uma tradução, consulte dicionários bíblicos e, quando houver dúvida, converse com um líder ou professor de confiança.",
"Aplicação responsável: pergunte o que o texto ensina sobre Deus e sobre as pessoas e o que ele pede de você. Escolha uma ação pequena e concreta e registre depois como foi.",
"Estudo em profundidade: acompanhe um tema (como perdão ou sabedoria) por vários livros, anote as passagens e escreva uma síntese. Ensinar o que aprendeu a outra pessoa consolida o estudo."],

l:"Leitura com propósito: antes de ler, defina por que você lê (aprender, decidir, se divertir). O propósito define o ritmo, o que anotar e quando parar.",
L:["Leitura com propósito: antes de ler, defina por que você lê (aprender, decidir, se divertir). O propósito define o ritmo, o que anotar e quando parar.",
"Pré-leitura: observe título, sumário, introdução, conclusão e títulos de capítulos. Em 5 minutos você monta um mapa do livro e sabe onde prestar mais atenção.",
"Método SQ3R: Survey (examinar), Question (perguntar), Read (ler), Recite (recitar com suas palavras) e Review (revisar). Transforme títulos em perguntas e responda sem olhar.",
"Anotações úteis: marque pouco e escreva muito, com suas palavras. Registre ideia central, exemplos, dúvidas e aplicações. Anotar com as próprias palavras é o que fixa o conteúdo.",
"Retenção: revise o que leu em 1, 3, 7 e 21 dias, resuma cada capítulo em 3 linhas e ensine o conteúdo a alguém. Reler tudo é menos eficaz que se testar.",
"Leitura crítica: pergunte qual é a tese do autor, que evidências ele usa, que objeções existem e o que ficou de fora. O objetivo é concordar ou discordar com base em argumentos.",
"Hábito de leitura: leia no mesmo horário, comece com 10 a 15 minutos, deixe o livro à vista e acompanhe páginas ou tempo. Constância vence maratona.",
"Tipos de texto: ficção pede imersão, não ficção pede mapa e anotação, e textos técnicos pedem leitura em camadas (visão geral e depois detalhes). Adapte o método ao tipo de texto."],

const EXTRA5={
emo:["Comunicação emocional: expresse o que sente com frases como \"eu me sinto… quando… porque…\". Falar do que sente sem acusar reduz defesas e aproxima as pessoas.","Estresse e recuperação: o estresse prolongado reduz a clareza e a paciência. Programe pausas, sono regular, movimento e descanso real; recuperar-se faz parte do desempenho.","Mágoas e perdão: remoer mágoas prende a atenção no passado. Reconheça o que sentiu, defina o que precisa mudar e decida o que fazer. Perdoar não é aprovar o que ocorreu, é soltar o peso que você carrega.","Emoções no trabalho: perceba o clima, peça esclarecimentos antes de supor intenções e, diante de críticas, separe o fato da interpretação. Isso evita conflitos desnecessários."],
int:["Modelos mentais: são formas simples de entender situações, como custo de oportunidade e causa e efeito. Aprender alguns bons modelos melhora a análise de problemas de áreas diferentes.","Falácias e vieses comuns: cuidado com o apelo à emoção, o falso dilema (só duas opções), a ladeira escorregadia e o viés de disponibilidade (julgar pelo que vem fácil à mente). Nomear o erro ajuda a evitá-lo.","Estudar com foco: estude em blocos de 25 a 50 minutos, com um objetivo por bloco e longe de distrações. Alterne temas, faça testes e explique em voz alta o que aprendeu.","Criatividade: separe gerar de avaliar. Primeiro produza muitas opções sem julgar e depois escolha com critérios. Combinar ideias de áreas diferentes costuma gerar soluções originais."],
lin:["Histórias que comunicam: apresente um personagem, um desafio, o que foi feito e o resultado. Use exemplos concretos em vez de abstrações.","Escrita clara: prefira frases curtas, voz ativa e palavras simples. Corte o que não acrescenta e coloque a ideia principal no começo do parágrafo.","Debate respeitoso: resuma o argumento do outro antes de responder, discuta ideias e não pessoas e admita pontos válidos. O objetivo é entender melhor, não só vencer.","Aprender idiomas: combine vocabulário em contexto, escuta ativa e fala desde cedo. Use o idioma em situações reais, mesmo com erros, e revise as palavras em intervalos crescentes."],
intra:["Energia e rotina: reserve as tarefas difíceis para os horários de maior energia, proteja o sono e use pausas curtas. Uma rotina bem desenhada reduz a necessidade de decidir o tempo todo.","Dizer não: recusar o que não é prioridade libera tempo para o que importa. Responda com clareza e respeito, sem excesso de justificativas, e ofereça alternativa quando fizer sentido.","Ambiente e foco: o ambiente influencia o comportamento. Deixe à vista o que quer fazer e longe o que distrai; pequenas mudanças no espaço reduzem o esforço de força de vontade.","Valores e escolhas: escrever seus valores (como honestidade, família, fé e crescimento) ajuda a decidir o que aceitar e o que recusar. Quando metas e valores combinam, a consistência fica mais fácil."],
inter:["Feedback: ao dar, descreva o comportamento, o impacto e uma sugestão. Ao receber, escute até o fim, agradeça e peça exemplos antes de reagir.","Trabalho em equipe: equipes funcionam com objetivos claros, papéis definidos e combinados sobre como comunicar problemas. Admitir erros cedo reduz danos e aumenta a confiança.","Limites e assertividade: limites claros protegem relacionamentos. Diga o que aceita e o que não aceita de forma direta e calma e mantenha coerência com o que combinou.","Rede de contatos ética: construir contatos é ajudar antes de pedir. Ofereça informação, apresente pessoas e mantenha contato regular; relações duradouras vêm de interesse genuíno."],
fin:["Saindo das dívidas: liste todas, priorize as de juros mais altos, negocie condições e evite novas dívidas durante o processo. Pequenas economias consistentes ajudam a quitar mais rápido.","Metas financeiras: defina metas com valor, prazo e passos. Divida o valor pelo número de meses e separe o dinheiro no dia em que a renda entra, de preferência de forma automática.","Proteção contra imprevistos: imprevistos podem desfazer anos de planejamento. Avalie proteções compatíveis com a sua realidade e compare custos e coberturas antes de contratar.","Empreender com testes: antes de investir muito, teste a ideia. Converse com clientes, venda uma versão simples e meça o interesse; ajuste com base no que o mercado responde."],
bib:["Livros históricos e proféticos: os livros históricos contam a trajetória do povo e os profetas chamam à fidelidade, com avisos e esperança. Leia cada um no contexto do seu tempo e do seu público.","Os evangelhos: Mateus, Marcos, Lucas e João apresentam a vida e os ensinos de Jesus com ênfases diferentes. Ler os quatro, comparando passagens paralelas, enriquece a compreensão.","As cartas: respondem a situações concretas de igrejas e pessoas. Identifique o destinatário, o problema tratado e o argumento do autor antes de aplicar.","Meditação com o texto: meditar é ler devagar, repetir um trecho, perguntar o que ele revela e transformar a reflexão em oração e atitude. Um registro curto ajuda a perceber o crescimento."],
lei:["Leitura rápida e profunda: a velocidade não é o objetivo. Leia rápido o que é simples e devagar o que é difícil; evite voltar sem necessidade, mas releia quando perder o fio.","Artigos científicos: comece pelo resumo e pelas conclusões e depois observe o método e os resultados. Avalie a amostra, as limitações e se as conclusões decorrem dos dados.","Discussão de leituras: conversar sobre um livro revela pontos cegos. Prepare três perguntas, ouça interpretações diferentes e registre o que mudou na sua visão.","Biblioteca pessoal: escolha poucos livros por vez, com objetivo claro. Registre o que leu, avalie e anote aplicações; uma lista simples de leituras ajuda a manter o foco e medir o progresso."]};

const cumXP=L=>25*L*(L-1);
function lvl(){const x=tot();let L=Math.max(1,Math.floor((1+Math.sqrt(1+4*x/25))/2));while(cumXP(L+1)<=x)L++;while(L>1&&cumXP(L)>x)L--;const need=50*L,into=x-cumXP(L);return{L,x,into,need,pct:Math.min(100,Math.round(into/need*100))}}
function nav(){const L=[["home","Início"],["metas","Metas"],["ia","A.P.E.X."],["rel","Progresso"],["perfil","Perfil"]],n=$("#nav");document.body.classList.remove("rail");n.className="nbar";n.hidden=!S.seen;n.setAttribute("aria-label","Navegação principal");

function pendItems(){const t=today(),L=[],dr=S.srs.filter(x=>x.due<=t).length;if(dr)L.push(["treino",dr+" pergunta(s) para revisar hoje"]);const at=S.metas.filter(m=>!m.done&&m.due&&m.due<t).length;if(at)L.push(["metas",at+" meta(s) atrasada(s)"]);const hp=S.habits.filter(h=>!h.log.includes(t)).length;if(hp)L.push(["hab",hp+" hábito(s) ainda não feito(s) hoje"]);const m=dailyMission();if(!S.done.some(x=>x.k==m.k))L.push(["missoes","Missão diária pendente"]);return L}
function hdr(){const n=pendItems().length;$("#hdr").innerHTML=`<div class="apex-brand"><img class="ic" src="${ICON.apex}" alt="" width="39" height="39"><div class="brand-w"><h1>A.P.E.X.<span class="brand-dot">.</span></h1><div class="tag">PERSONAL EVOLUTION SYSTEM</div></div></div><div class="hr"><button class="hb" aria-label="Notificações${n?" ("+n+" pendências)":""}" onclick="go('pend')">${ic("bell",20)}${n?`<span class="badge">${n>9?"9+":n}</span>`:""}</button><button class="hb" aria-label="Menu completo" onclick="go('menu')">${ic("grid",20)}</button></div>`}
function pendView(){const L=pendItems();return`<div class="card fade"><h2>Pendências</h2>${L.length?L.map(([k,t])=>`<div class="ritem"><span style="flex:1">${esc(t)}</span><button onclick="go('${k}')">Abrir</button></div>`).join(""):'<p class="ok">Tudo em dia por hoje.</p>'}</div>`}
function menuView(){return`<div class="card fade"><h2>Menu</h2><div class="mgrid">${MENU.map(([k,v])=>`<button class="mt" onclick="go('${k}')"><span class="tile">${icn(k,38)}</span><span>${v}</span></button>`).join("")}</div></div>`}
function ring(p){const r=46,c=2*Math.PI*r;return`<svg viewBox="0 0 112 112" width="112" height="112" role="img" aria-label="${p}% da rotina de hoje"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25e8ff"/><stop offset="1" stop-color="#1e90ff"/></linearGradient></defs><circle cx="56" cy="56" r="${r}" fill="none" stroke="#0d1d52" stroke-width="10"/><circle cx="56" cy="56" r="${r}" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p/100)).toFixed(1)}" transform="rotate(-90 56 56)" style="filter:drop-shadow(0 0 6px #25e8ff)"/><text x="56" y="58" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">${p}%</text><text x="56" y="76" text-anchor="middle" font-size="10" fill="#9db4e8">da rotina</text><text x="56" y="87" text-anchor="middle" font-size="10" fill="#9db4e8">do dia</text></svg>`}

async function readSSE(r){const rd=r.body.getReader(),dec=new TextDecoder();let buf="",fin=null;
for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let m;
while((m=/\r?\n\r?\n/.exec(buf))){const blk=buf.slice(0,m.index);buf=buf.slice(m.index+m[0].length);let ev="",dt="";blk.split(/\r?\n/).forEach(l=>{if(l.startsWith("event:"))ev=l.slice(6).trim();else if(l.startsWith("data:"))dt+=l.slice(5).trim()});if(!dt)continue;let j;try{j=JSON.parse(dt)}catch(e){continue}
if(ev=="d"){LIVE+=String(j.t||"");liveUpdate()}else if(ev=="f")fin=j;else if(ev=="e")throw{status:j.status||502,msg:j.error||""}}}
if(!fin)throw{status:502,msg:"resposta incompleta"};return fin}
async function callAI(wire,signal){const body={messages:wire,tools:toolDecls(),context:buildCtx()},ins=activeInstructions();if(ins)body.instructions=ins;if(S.ai.stream!==false)body.stream=true;
const url=S.ai.endpoint.replace(/\/+$/,"")+"/chat",hd={"Content-Type":"application/json","X-Apex-Token":S.ai.token},bad=async r=>{let m="";try{m=(await r.json()).error||""}catch(e){}return{status:r.status,msg:m}};
let r=await fetch(url,{method:"POST",headers:hd,body:JSON.stringify(body),signal});if(!r.ok)throw await bad(r);
if((r.headers.get("content-type")||"").includes("text/event-stream")){try{return await readSSE(r)}catch(e){if(e&&e.name=="AbortError")throw e;if(e&&e.status&&![500,502].includes(e.status))throw e;
LIVE="";delete body.stream;r=await fetch(url,{method:"POST",headers:hd,body:JSON.stringify(body),signal});if(!r.ok)throw await bad(r);return r.json()}}
return r.json()}
async function execTool(tc,c){const T=TOOLS[tc.name],tag=TN[tc.name]||tc.name;let res;
if(!T)res={ok:false,error:"ferramenta desconhecida"};
else{const p=perm(tc.name),v=vArgs(T,tc.args);
if(!p.on)res={ok:false,error:"ferramenta desativada pelo usuário em Permissões"};
else if(v.error)res={ok:false,error:v.error};
else if(T.data&&!S.ai.share.prog)res={ok:false,error:"o usuário não autorizou o acesso aos dados do app"};
else{let go=true;if(p.ask){const q=T.ask?T.ask(v.args):"Permitir a ação “"+tag+"”? "+JSON.stringify(v.args).slice(0,160);go=await askConfirm(q);logAuth("confirmação",q,go?"aprovado":"negado")}

c.m.push({r:"s",t:(res.ok?"✓ ":"⚠ ")+(res.msg||"Ação não realizada: "+res.error)});save();render();return res}
async function runAgent(c){BUSY=true;LIVE="";ABORT=new AbortController();render();
const wire=c.m.filter(x=>x.r!="s").slice(-20).map(x=>({role:x.r=="u"?"user":"assistant",content:x.t}));while(wire.length&&wire[0].role!="user")wire.shift();const cache=new Map();
try{let fin=false;for(let i=0;i<5&&!fin;i++){const r=await callAI(wire,ABORT.signal);LIVE="";
if(r.toolCalls&&r.toolCalls.length){if(r.text)c.m.push({r:"a",t:r.text,ts:Date.now()});wire.push({role:"assistant",content:r.text||"",toolCalls:r.toolCalls,state:r.state||undefined});
for(const tc of r.toolCalls.slice(0,4)){const T=TOOLS[tc.name],key=!T||T.write||T.confirm?"":tc.name+JSON.stringify(tc.args||{});let res;
if(key&&cache.has(key))res=cache.get(key);else{res=await execTool(tc,c);if(key&&res.ok)cache.set(key,res)}
wire.push({role:"tool",toolName:tc.name,content:JSON.stringify(res.ok?{ok:true,mensagem:res.msg,...(res.data||{})}:{ok:false,erro:res.error}).slice(0,7500)})}}
else{c.m.push({r:"a",t:(r.text||"").trim()||"(sem resposta)",ts:Date.now()});fin=true}}
if(!fin)c.m.push({r:"s",t:"⚠ Limite de passos atingido sem resposta final."})}
catch(e){const ab=e&&e.name=="AbortError";if(ab&&LIVE.trim())c.m.push({r:"a",t:LIVE.trim()+" …",ts:Date.now()});c.m.push({r:"s",t:ab?"Resposta interrompida.":errMsg(e||{})})}
LIVE="";BUSY=false;ABORT=null;PEND=null;save();render()}
